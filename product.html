<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SELENE</title>
<meta name="description" content="SELENE demi-fine jewellery — tarnish-resistant 18K PVD pieces curated for the modern muse.">
<link rel="icon" type="image/png" href="assets/img/brand/favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="product">

<main id="top" class="wrap">

  <div id="pdp"></div>

  <section class="pdp-reviews" id="reviewsSection">
    <div class="section-head">
      <p class="eyebrow">Worn &amp; reviewed</p>
      <h2>What they say</h2>
    </div>
    <div class="review-layout">
      <form class="review-form" id="reviewForm">
        <h3>Write a review</h3>
        <div class="rate-pick" id="ratePick" aria-label="Your rating">
          <button type="button" data-rate="1">★</button><button type="button" data-rate="2">★</button><button type="button" data-rate="3">★</button><button type="button" data-rate="4">★</button><button type="button" data-rate="5">★</button>
        </div>
        <input type="text" id="rvName" placeholder="Your name" required aria-label="Your name">
        <textarea id="rvText" rows="4" placeholder="How does it wear? How does it look?" required aria-label="Your review"></textarea>
        <button class="btn btn-solid" type="submit">Post review</button>
        <p class="form-note">Reviews are saved to this device.</p>
      </form>
      <div class="review-list" id="reviewList"></div>
    </div>
  </section>

  <section class="shop" id="relatedSection">
    <div class="section-head">
      <p class="eyebrow">Complete the set</p>
      <h2>Pairs beautifully</h2>
    </div>
    <div class="grid" id="relatedGrid"></div>
  </section>

</main>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script src="pages/product.js"></script>
<script>initPage()</script>
</body>
</html>
